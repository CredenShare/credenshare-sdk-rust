name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, because the failure the drift job catches is not caused by a commit here. The wire
  # specification can move in the application's repository and leave this SDK silently behind,
  # and nobody would push anything for CI to notice.
  schedule:
    - cron: "35 6 * * 1"
  # GitHub disables a scheduled workflow after 60 days without repository activity, and a
  # drift check that has quietly stopped running looks exactly like one that keeps passing.
  # This is the way to run it on demand, and to confirm it still can.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.rust }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        rust: [stable, beta, "1.88"] # the MSRV in Cargo.toml - this job is what proves it
        include:
          # The crypto is portable; line endings are not, and Windows is where a CRLF checkout
          # would break the embedded fixture's pinned digest.
          - os: windows-latest
            rust: stable
          - os: macos-latest
            rust: stable

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2

      - run: cargo build --all-targets
      - run: cargo test --all-targets
      # --all-targets EXCLUDES doctests. lib.rs includes the README specifically so its
      # examples are compiled, and without this line nothing ever compiled them - the exact
      # gap that arrangement was introduced to close.
      - run: cargo test --doc

      - name: The crypto must compile without the client
        # The crate claims a caller can take the crypto alone. A claim nothing exercises is a
        # claim that stops being true without anyone noticing — and the failure lands on
        # somebody building for a target where a TLS stack will not compile at all.
        run: cargo build --no-default-features

      - name: Self-check the built binary
        # Exactly what a user runs after installing. Running it here means a broken checker
        # cannot ship: a self-check that always passes is worse than none, because it turns an
        # unverified installation into one somebody believes is verified.
        run: cargo run --bin credenshare-conformance -- -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  conformance-drift:
    name: the fixture still matches the published spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Compare the embedded fixture against the published one
        # THE check this job exists for.
        #
        # The application and the four SDKs share no code, deliberately: a package the
        # production application depended on would mean a compromised publish is a compromised
        # application. The cost of that decision is drift, and drift here does not fail a test
        # in normal use — it produces content that can never be decrypted, discovered by a
        # customer when a link does not open.
        #
        # The URL is configuration rather than a constant because there is no canonical
        # public copy to hardcode: the specification and the vectors ship in this repository.
        # Point the variable at one when a canonical copy exists - or at a candidate fixture
        # on a branch, before publishing it.
        env:
          # Opt-in. This SDK is self-contained: the spec and the vectors both ship in
          # this repository, and the digest pin already catches a local edit. What
          # this job adds is the OTHER direction — noticing that the canonical
          # fixture moved and this repo did not — which needs a canonical URL to
          # compare against. Set the repository variable when one exists; until
          # then the check skips rather than failing on a URL that does not resolve.
          CREDENSHARE_VECTORS_URL: ${{ vars.CREDENSHARE_VECTORS_URL }}
        run: |
          # Trim, so a variable set to whitespace is treated as unset rather than as a URL.
          CREDENSHARE_VECTORS_URL="$(echo "${CREDENSHARE_VECTORS_URL}" | tr -d '[:space:]')"
          export CREDENSHARE_VECTORS_URL
          if [ -z "${CREDENSHARE_VECTORS_URL}" ]; then
            # Loud, not silent. A skipped drift check reads as a passing one on the summary
            # page, and this is the single job whose silence is expensive.
            echo "::warning title=Drift detection is NOT running::Set the repository variable CREDENSHARE_VECTORS_URL to a reachable copy of the published vectors.v1.json. Until then nothing verifies that this SDK's fixture matches the specification, and divergence will surface as content that cannot be decrypted."
          fi
          # Pin by exact name and count the passes. A substring filter that matches
          # nothing exits 0, so renaming a test would turn this job green while checking
          # nothing at all - the one failure mode a drift check cannot afford.
          cargo test --test conformance -- --nocapture --exact             the_embedded_fixture_has_not_been_edited             the_embedded_fixture_matches_the_published_one | tee /tmp/drift.txt
          # UNCONDITIONAL. Both tests report as passed even with the URL unset - the
          # published-comparison one returns early and says it skipped - so guarding this
          # on the variable meant the anti-rename check never ran in the SHIPPED state,
          # which is the only state it needs to work in. A renamed or deleted fixture
          # test would have turned this job green while checking nothing.
          grep -q "2 passed" /tmp/drift.txt || {
            echo "::error::expected both fixture tests to run and pass; the names have moved"
            exit 1
          }

  package:
    name: the published crate carries the fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Package and verify the fixture is inside
        # `include` in Cargo.toml decides what ships. A packaging mistake that dropped the
        # vectors would leave every consumer's self-check failing on an install that is
        # otherwise fine, while CI ran happily against the copy in the source tree.
        run: |
          cargo package --allow-dirty
          cargo package --list --allow-dirty | grep -qx 'src/vectors.v1.json' \
            || { echo "::error::the conformance vectors are not in the packaged crate"; exit 1; }

name: Release

# Tag-triggered. Publishing to crates.io is irreversible — a version can be yanked but never
# reused, and never replaced — so everything is verified before the publish step runs.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify before anything is published
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # The env belongs on THIS step. The fixture-drift comparison is an integration test
      # in tests/conformance.rs, which --all-targets runs and --doc never does. Inserting
      # the doctest step above the env block moved the variable onto the doctest step, so
      # the release build could not check drift even with the variable set - the exact
      # failure the comment claimed it prevented.
      - run: cargo test --all-targets
        env:
          CREDENSHARE_VECTORS_URL: ${{ vars.CREDENSHARE_VECTORS_URL }}
      # --all-targets excludes doctests; the README examples are doctests. No env: no
      # doctest reads the vectors URL.
      - run: cargo test --doc
      - run: cargo run --bin credenshare-conformance -- -v

      - name: The crypto must still compile without the client
        # The crate promises a caller can take the crypto alone. Releasing a version where
        # that stopped being true would break exactly the embedded targets it was promised
        # for, and they are the least likely to notice quickly.
        run: cargo build --no-default-features

      - name: The tag must match the version in Cargo.toml
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag v$TAG does not match Cargo.toml version $VERSION"
            exit 1
          fi
          echo "releasing $VERSION"

      - name: The packaged crate must carry the fixture
        # `include` in Cargo.toml decides what ships. A packaging mistake that dropped the
        # vectors would leave every consumer's self-check failing on an install that is
        # otherwise fine — and on crates.io that version can never be corrected, only
        # yanked and replaced.
        run: |
          cargo package --allow-dirty
          cargo package --list --allow-dirty | grep -qx 'src/vectors.v1.json' \
            || { echo "::error::the conformance vectors are not in the packaged crate"; exit 1; }

  publish:
    permissions:
      # gh release create needs this
      contents: write
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/credenshare
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # CARGO_REGISTRY_TOKEN is a repository secret. crates.io has no OIDC trusted-publishing
      # equivalent to PyPI's or npm's yet, so this is the one release path in the four that
      # still needs a long-lived credential. Scope it to publish-update on this crate only.
      - name: Publish
        if: vars.PUBLISH_TO_REGISTRY == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set; add it as a repository secret"
            exit 1
          fi
          cargo publish

      - name: Registry publication is not switched on
        if: vars.PUBLISH_TO_REGISTRY != 'true'
        run: |
          echo "::notice title=Not published to the registry::This release was verified and \
          tagged, but PUBLISH_TO_REGISTRY is not 'true' so nothing was uploaded. Configure the \
          registry credential for this repository, then set the repository variable \
          PUBLISH_TO_REGISTRY=true. See VERSIONING.md."

      # A GitHub Release is the durable, registry-independent artifact: it exists whether or
      # not PUBLISH_TO_REGISTRY is on, so a tag always produces something a consumer can
      # point at and something this repository can be verified against later.
      - name: Publish the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME"             --title "$GITHUB_REF_NAME"             --notes "Install:

          \`\`\`
          credenshare = { git = "https://github.com/CredenShare/credenshare-sdk-rust", tag = "$GITHUB_REF_NAME" }
          \`\`\`

          Verify the install against the wire specification:

          \`\`\`
          cargo run --bin credenshare-conformance
          \`\`\`

          See CHANGELOG.md for what changed.

          Not on crates.io yet - see VERSIONING.md."

[package]
name = "credenshare"
version = "0.2.0"
edition = "2021"
# Measured by CI, twice. 1.74 was a guess; 1.85 was the edition-2024 floor that base64ct
# forced; 1.88 is what the icu_* crates demand, and they arrive through the OPTIONAL client
# feature (ureq -> url -> idna -> icu). So the crypto itself compiles far lower than this
# number suggests - the floor is the HTTP stack, and a caller taking default-features = false
# is not really bound by it. Cargo has one rust-version field, so the higher one is declared.
# Raise it only in response to a green MSRV job, never to a hope.
rust-version = "1.88"
description = "End-to-end encrypted secret sharing. Encryption happens on your machine."
license = "MIT OR Apache-2.0"
repository = "https://github.com/CredenShare/credenshare-sdk-rust"
homepage = "https://credenshare.io"
readme = "README.md"
keywords = ["credenshare", "secrets", "encryption", "e2ee", "zero-knowledge"]
categories = ["cryptography", "api-bindings"]
# The vectors ship inside the crate so `cargo run --bin credenshare-conformance` verifies the
# exact artifact that was published, not a copy that happened to sit beside it.
include = ["src/**/*", "tests/**/*", "README.md", "CRYPTO_WIRE_SPEC.md", "VERSIONING.md", "LICENSE-MIT", "LICENSE-APACHE", "NOTICE"]

[dependencies]
# RustCrypto, which is the ecosystem's audited implementation of exactly these primitives.
# Pinned to minor versions: a crypto crate's patch releases are worth taking, its breaking
# ones are worth reading first.
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
p256 = { version = "0.13", features = ["ecdh"] }
elliptic-curve = "0.13"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
subtle = "2"
# Key material outlives its use in the clear otherwise: derived AES keys, the content key
# and the seed all sit in freed heap or stack until something overwrites them.
zeroize = { version = "1", features = ["zeroize_derive"] }
# The HTTP client is optional. A caller embedding only the crypto — a Worker, a CLI that
# posts with its own client — should not compile a TLS stack it never calls.
ureq = { version = "2.10", optional = true, default-features = false, features = ["tls", "json"] }

[dev-dependencies]
hex = "0.4"
ureq = { version = "2.10", default-features = false, features = ["tls", "json"] }

[features]
default = ["client"]
client = ["dep:ureq"]

[[bin]]
name = "credenshare-conformance"
path = "src/bin/conformance.rs"

# Governs THIS crate's own test and binary builds only. Cargo ignores a dependency's
# [profile] section, so a consumer of the published crate does not get this - it is a local
# development setting, not a guarantee about released code.
[profile.release]
overflow-checks = true
